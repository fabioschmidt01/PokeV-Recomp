<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background sky gradient: Hisuian Cosmos -->
    <linearGradient id="hisui_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="40%" stop-color="#0f2244"/>
      <stop offset="75%" stop-color="#1d3f66"/>
      <stop offset="100%" stop-color="#2a5c7a"/>
    </linearGradient>

    <!-- Space-Time Rift Energy Gradient -->
    <radialGradient id="rift_glow" cx="0.5" cy="0.32" r="0.45">
      <stop offset="0%" stop-color="#00ffe0" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#7b2cbf" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3a0ca3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050b1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain Snow Gradient -->
    <linearGradient id="snow_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2eafd"/>
      <stop offset="100%" stop-color="#9bb5d9"/>
    </linearGradient>

    <!-- Mountain Rock Shadow -->
    <linearGradient id="rock_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3a52"/>
      <stop offset="100%" stop-color="#131c2b"/>
    </linearGradient>

    <!-- Arceus Celestial Gold Gradient -->
    <linearGradient id="arceus_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="25%" stop-color="#fcd34d"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <!-- Arceus Emerald Gems -->
    <radialGradient id="arceus_emerald" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <!-- Ancient Pokeball Wood & Bronze -->
    <linearGradient id="hisui_wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="hisui_red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <clipPath id="squircle">
      <rect x="80" y="80" width="864" height="864" rx="192" ry="192"/>
    </clipPath>
    
    <filter id="celestial_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Container with Squircle Clipping -->
  <g clip-path="url(#squircle)">
    <!-- Sky Base -->
    <rect x="80" y="80" width="864" height="864" fill="url(#hisui_sky)"/>

    <!-- Nebula Stars -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="180" cy="190" r="3"/>
      <circle cx="260" cy="240" r="2"/>
      <circle cx="340" cy="160" r="2.5"/>
      <circle cx="720" cy="190" r="3"/>
      <circle cx="820" cy="270" r="2.5"/>
      <circle cx="780" cy="360" r="2"/>
      <circle cx="220" cy="380" r="2.2"/>
      <circle cx="490" cy="140" r="3.2"/>
    </g>

    <!-- Space-Time Rift Phenomenon -->
    <ellipse cx="512" cy="330" rx="360" ry="240" fill="url(#rift_glow)"/>
    
    <!-- Rift Lightning Fractures -->
    <path d="M512 140 Q495 240 520 290 T505 380 T512 470" stroke="#a7f3d0" stroke-width="4" fill="none" opacity="0.9" filter="url(#celestial_glow)"/>
    <path d="M512 250 Q460 270 430 330" stroke="#c084fc" stroke-width="3" fill="none" opacity="0.75"/>
    <path d="M520 280 Q570 310 610 350" stroke="#67e8f9" stroke-width="3" fill="none" opacity="0.75"/>

    <!-- Mount Coronet Range Silhouette -->
    <!-- Distant peaks -->
    <polygon points="120,680 320,440 460,560 620,420 840,660 944,700 944,944 80,944 80,720" fill="url(#rock_grad)" opacity="0.9"/>
    <!-- Central Summit (Mount Coronet) -->
    <polygon points="260,780 512,470 764,780 512,830" fill="url(#rock_grad)"/>
    <polygon points="512,470 470,550 512,580 560,540" fill="url(#snow_grad)"/>
    <polygon points="320,440 280,500 340,510" fill="url(#snow_grad)"/>
    <polygon points="620,420 580,480 645,490" fill="url(#snow_grad)"/>

    <!-- ============================================== -->
    <!-- ARCEUS SACRED WHEEL / CELESTIAL WHEEL EMBLEM   -->
    <!-- ============================================== -->
    <g transform="translate(512, 490)" filter="url(#celestial_glow)">
      <!-- Outer Golden Halo Aura -->
      <circle cx="0" cy="0" r="176" fill="none" stroke="#fcd34d" stroke-width="6" opacity="0.4"/>
      <circle cx="0" cy="0" r="150" fill="none" stroke="url(#arceus_gold)" stroke-width="18" stroke-linecap="round"/>

      <!-- Sacred Four Spokes / Arcs of Arceus -->
      <!-- Vertical Spoke -->
      <path d="M-14,-210 L14,-210 L18,-110 L-18,-110 Z" fill="url(#arceus_gold)"/>
      <path d="M-14,210 L14,210 L18,110 L-18,110 Z" fill="url(#arceus_gold)"/>
      <!-- Horizontal Spoke -->
      <path d="M-210,-14 L-210,14 L-110,18 L-110,-18 Z" fill="url(#arceus_gold)"/>
      <path d="M210,-14 L210,14 L110,18 L110,-18 Z" fill="url(#arceus_gold)"/>

      <!-- Diagonal Arch Wings -->
      <path d="M-130,-130 Q-165,-60 -130,0 Q-165,60 -130,130 Q-60,165 0,130 Q60,165 130,130 Q165,60 130,0 Q165,-60 130,-130 Q60,-165 0,-130 Q-60,-165 -130,-130 Z" 
            fill="none" stroke="url(#arceus_gold)" stroke-width="14"/>

      <!-- The 4 Cardinal Emerald Jewels of Creation -->
      <circle cx="0" cy="-150" r="20" fill="url(#arceus_emerald)" stroke="#fff" stroke-width="3"/>
      <circle cx="0" cy="150" r="20" fill="url(#arceus_emerald)" stroke="#fff" stroke-width="3"/>
      <circle cx="-150" cy="0" r="20" fill="url(#arceus_emerald)" stroke="#fff" stroke-width="3"/>
      <circle cx="150" cy="0" r="20" fill="url(#arceus_emerald)" stroke="#fff" stroke-width="3"/>

      <!-- Center Divine Core -->
      <circle cx="0" cy="0" r="42" fill="url(#arceus_gold)" stroke="#fff" stroke-width="4"/>
      <circle cx="0" cy="0" r="22" fill="#0f172a"/>
      <circle cx="0" cy="0" r="14" fill="#67e8f9" filter="url(#celestial_glow)"/>
    </g>

    <!-- Foreground: Ancient Hisui Pokéball Crest -->
    <g transform="translate(512, 820)">
      <!-- Ball base -->
      <circle cx="0" cy="0" r="95" fill="url(#hisui_wood)" stroke="#1e293b" stroke-width="6"/>
      <!-- Top Red Lacquer Half -->
      <path d="M-95,0 A95,95 0 0,1 95,0 Z" fill="url(#hisui_red)"/>
      <!-- Center Bronze Band -->
      <line x1="-95" y1="0" x2="95" y2="0" stroke="#ca8a04" stroke-width="12"/>
      <!-- Front Latch Mechanism -->
      <circle cx="0" cy="0" r="26" fill="#fef08a" stroke="#854d0e" stroke-width="5"/>
      <circle cx="0" cy="0" r="12" fill="#451a03"/>
    </g>

    <!-- Inner Soft Border Glow -->
    <rect x="80" y="80" width="864" height="864" rx="192" ry="192" fill="none" stroke="url(#arceus_gold)" stroke-width="8" opacity="0.6"/>
  </g>

  <!-- Outer Icon Subtle Border -->
  <rect x="80" y="80" width="864" height="864" rx="192" ry="192" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
</svg>