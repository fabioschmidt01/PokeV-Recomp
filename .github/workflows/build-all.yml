  release:
    name: Publish GitHub Release
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PokeV-Recomp-windows-x64
          path: dist-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.zip
          name: "PokeV-Recomp ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## PokeV-Recomp (Pokémon Violet & Scarlet Recomp) ${{ github.ref_name }}
            
            Native PC port of **Pokémon Violet & Scarlet** (3.0.1).
            
            ### Included in this release:
            - **Windows x64**: `PokeV-Recomp-windows-x64.zip`
            
            ### Highlights:
            - Dedicated Intel Arc B580 12GB VRAM pool unlocking and Battlemage Xe2 tuning.
            - Intel Xeon high-core count multi-threading texture streaming.
            - Intel XeSS SDK AI neural upscaling support.
            - F10 TotK Recomp style hardware overlay HUD.
